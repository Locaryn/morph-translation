[package]
name = "locaryn-plugin-translation"
version = "2.0.0"
edition = "2021"
description = "Official Locaryn Extension: Multilingual Machine Translation (NLLB-200, Opus-MT)"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-translation-mcp"
path = "src/bin/translation_mcp.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[workspace]
